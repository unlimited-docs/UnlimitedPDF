name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # "Run workflow" in the Actions tab deploys main to production on demand, whatever DEPLOY_PRODUCTION says (QF-26111304).
  workflow_dispatch:

jobs:
  # Production: a merge to main deploys only while the repository variable DEPLOY_PRODUCTION is "true" (Settings >
  # Secrets and variables > Actions > Variables); "Run workflow" on main always deploys. Pull requests still get their
  # preview environment. (QF-26111304)
  build_and_deploy_job:
    if: >-
      (github.event_name == 'push' && vars.DEPLOY_PRODUCTION == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      # The deploy action's own builder (Oryx) does not support .NET 11, which the demos site targets, so the site is
      # published here and uploaded as built (QF-38).
      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Publish the demos site
        run: dotnet publish UnlimitedPDF.Demos.BlazorWasm/UnlimitedPDF.Demos.BlazorWasm.csproj --configuration Release --output publish
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BAY_057E55A10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "publish/wwwroot" # The published site, including staticwebapp.config.json
          api_location: "" # No API
          output_location: "" # Already built
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  # Says why a merge to main did not reach production, on the run's summary page (QF-26111304).
  production_deploy_skipped_job:
    if: github.event_name == 'push' && vars.DEPLOY_PRODUCTION != 'true'
    runs-on: ubuntu-latest
    name: Production Deploy Skipped
    steps:
      - name: Explain the skipped deploy
        env:
          FLAG: ${{ vars.DEPLOY_PRODUCTION }}
        run: |
          message="Production deploy skipped: DEPLOY_PRODUCTION is '${FLAG:-not set}', not 'true'. Use Run workflow on main to deploy now."
          echo "::notice title=Production deploy skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BAY_057E55A10 }}
          action: "close"
