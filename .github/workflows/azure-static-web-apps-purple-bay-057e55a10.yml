name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  # "Run workflow" in the Actions tab: with "Deploy to production" ticked, it builds main and deploys it to production,
  # whatever DEPLOY_PRODUCTION says; unticked (or on another branch), it only builds, as a dry run (QF-26111304,
  # QF-26111401).
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy to production"
        type: boolean
        default: false

jobs:
  # Production: a merge to main deploys only while the repository variable DEPLOY_PRODUCTION is "true" (Settings >
  # Secrets and variables > Actions > Variables); "Run workflow" deploys only from main with "Deploy to production"
  # ticked, and otherwise only builds. Pull requests still get their preview environment. (QF-26111304, QF-26111401)
  build_and_deploy_job:
    if: >-
      (github.event_name == 'push' && vars.DEPLOY_PRODUCTION == 'true') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      # The deploy action's own builder (Oryx) does not support .NET 11, which the demos site targets, so the site is
      # published here and uploaded as built (QF-38).
      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Publish the demos site
        run: dotnet publish UnlimitedPDF.Demos.BlazorWasm/UnlimitedPDF.Demos.BlazorWasm.csproj --configuration Release --output publish
      # A manual run without "Deploy to production" ticked, or started from a branch other than main, stops after the
      # build and says so on the run's summary page (QF-26111401).
      - name: Explain the build-only run
        if: github.event_name == 'workflow_dispatch' && !(inputs.deploy_production && github.ref == 'refs/heads/main')
        env:
          TICKED: ${{ inputs.deploy_production }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$TICKED" = "true" ]; then
            message="Build only: production deploys only from main, and this run is on '$REF'."
          else
            message="Build only: 'Deploy to production' was not ticked. The site built; nothing was deployed."
          fi
          echo "::notice title=Build only::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy
        id: builddeploy
        if: github.event_name != 'workflow_dispatch' || (inputs.deploy_production && github.ref == 'refs/heads/main')
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BAY_057E55A10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "publish/wwwroot" # The published site, including staticwebapp.config.json
          api_location: "" # No API
          output_location: "" # Already built
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  # Says why a merge to main did not reach production, on the run's summary page (QF-26111304).
  production_deploy_skipped_job:
    if: github.event_name == 'push' && vars.DEPLOY_PRODUCTION != 'true'
    runs-on: ubuntu-latest
    name: Production Deploy Skipped
    steps:
      - name: Explain the skipped deploy
        env:
          FLAG: ${{ vars.DEPLOY_PRODUCTION }}
        run: |
          message="Production deploy skipped: DEPLOY_PRODUCTION is '${FLAG:-not set}', not 'true'. Use Run workflow on main with 'Deploy to production' ticked to deploy now."
          echo "::notice title=Production deploy skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BAY_057E55A10 }}
          action: "close"
